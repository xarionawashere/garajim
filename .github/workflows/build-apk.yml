name: APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Testleri atla (yalnizca acil durumda)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Bagimliliklari yukle
        run: npm install --no-audit --no-fund

      - name: Web uygulamasini hazirla (internetsiz calisacak sekilde gom)
        run: node build-web.js

      - name: Otomatik testler (hata varsa APK uretilmez)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: npm test

      - name: Android projesini olustur
        run: |
          npx cap add android
          npx cap sync android
          # Yeni APK'nin sürüm kodunu artır: mevcut telefona install -r ile güncellenebilsin.
          python3 - <<'PYVER'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s, code = re.subn(r'(?m)^(\s*versionCode\s+)\d+\s*$', r'\g<1>14', s, count=1)
          s, name = re.subn(r'(?m)^(\s*versionName\s+)["\'][^"\']*["\']\s*$', r'\g<1>"1.4.2"', s, count=1)
          if not code or not name:
            raise SystemExit('Telefon versionCode/versionName alanları bulunamadı; APK sürümü güvenle güncellenemedi.')
          p.write_text(s, encoding='utf-8')
          print('Telefon sürümü: versionCode=14, versionName=1.4.2')
          PYVER

      - name: Native widget ve hatirlaticilari ekle
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/garajim/app android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable
          cp native-android/src/main/java/com/garajim/app/*.java android/app/src/main/java/com/garajim/app/
          cp native-android/src/main/res/drawable/*.xml android/app/src/main/res/drawable/
          cp native-android/src/main/res/layout/garajim_widget.xml android/app/src/main/res/layout/
          cp native-android/src/main/res/xml/garajim_widget_info.xml android/app/src/main/res/xml/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(p); root = tree.getroot()
          A = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          perms = [
            'android.permission.CAMERA', 'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION', 'android.permission.POST_NOTIFICATIONS',
            'android.permission.RECEIVE_BOOT_COMPLETED', 'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_LOCATION'
          ]
          existing = {x.get(A+'name') for x in root.findall('uses-permission')}
          for perm in perms:
            if perm not in existing:
              element = ET.Element('uses-permission', {A+'name': perm})
              root.insert(list(root).index(app) if app is not None else len(root), element)
          receivers = [
            ('com.garajim.app.GarajimWidgetProvider', ['android.appwidget.action.APPWIDGET_UPDATE'], '@xml/garajim_widget_info', True),
            ('com.garajim.app.GarajimReminderReceiver', [], None, False),
            ('com.garajim.app.GarajimBootReceiver', ['android.intent.action.BOOT_COMPLETED', 'android.intent.action.MY_PACKAGE_REPLACED'], None, True),
          ]
          present = {r.get(A+'name') for r in app.findall('receiver')}
          for name, actions, meta, exported in receivers:
            if name in present: continue
            r = ET.SubElement(app, 'receiver', {A+'name': name, A+'exported': 'true' if exported else 'false'})
            if actions:
              f = ET.SubElement(r, 'intent-filter')
              for act in actions: ET.SubElement(f, 'action', {A+'name': act})
            if meta:
              ET.SubElement(r, 'meta-data', {A+'name': 'android.appwidget.provider', A+'resource': meta})
          # Wear OS komut dinleyici: eski BIND_LISTENER yerine yalnızca
          # /garajim/cmd mesajlarını dinle; bu, WearableBindListener lint hatasını giderir.
          wear_svc = 'com.garajim.app.GarajimWearListener'
          services0 = {s.get(A+'name'): s for s in app.findall('service')}
          ws = services0.get(wear_svc)
          if ws is None:
            ws = ET.SubElement(app, 'service', {A+'name': wear_svc, A+'exported': 'true'})
          # Mevcut/eski intent filtrelerini kaldırıp dar kapsamlı filtre ekle.
          for old_filter in list(ws.findall('intent-filter')):
            ws.remove(old_filter)
          wf = ET.SubElement(ws, 'intent-filter')
          ET.SubElement(wf, 'action', {A+'name': 'com.google.android.gms.wearable.MESSAGE_RECEIVED'})
          ET.SubElement(wf, 'data', {A+'scheme': 'wear', A+'host': '*', A+'pathPrefix': '/garajim/cmd'})
          # Sürüş arka plan foreground service
          svc_name = 'com.garajim.app.GarajimRideService'
          services = {s.get(A+'name'): s for s in app.findall('service')}
          ride_svc = services.get(svc_name)
          if ride_svc is None:
            ride_svc = ET.SubElement(app, 'service', {A+'name': svc_name})
          # Mevcut manifestte servis önceden varsa da arka plan şartlarını garanti et.
          ride_svc.set(A+'exported', 'false')
          ride_svc.set(A+'foregroundServiceType', 'location')
          ride_svc.set(A+'stopWithTask', 'false')
          # Müzik kontrolü: bildirim dinleyici (kullanıcı izin verirse şarkı bilgisi okunur) + Spotify görünürlüğü
          lst = 'com.garajim.app.GarajimMediaListener'
          if lst not in services:
            sv = ET.SubElement(app, 'service', {A+'name': lst, A+'label': 'Garajım müzik kontrolü', A+'exported': 'true', A+'permission': 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE'})
            f = ET.SubElement(sv, 'intent-filter'); ET.SubElement(f, 'action', {A+'name': 'android.service.notification.NotificationListenerService'})
          q = root.find('queries')
          if q is None: q = ET.SubElement(root, 'queries')
          if not [x for x in q.findall('package') if x.get(A+'name') == 'com.spotify.music']:
            ET.SubElement(q, 'package', {A+'name': 'com.spotify.music'})
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY

      - name: Uygulama simgelerini ekle
        run: |
          if ! command -v convert >/dev/null; then sudo apt-get update && sudo apt-get install -y imagemagick; fi
          R=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read -r n s f <<< "$d"
            convert icon.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher.png"
            convert icon.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher_round.png"
            convert icon-foreground.png -resize ${f}x${f} "$R/mipmap-$n/ic_launcher_foreground.png"
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0A0A0A</color>\n</resources>\n' > "$R/values/ic_launcher_background.xml"

      - name: Release imzasi yapilandir (varsa)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/garajim.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            cat >> android/app/build.gradle <<'GRADLE'

            android {
                signingConfigs {
                    release {
                        storeFile file("../keystore/garajim.jks")
                        storeType "pkcs12"
                        storePassword System.getenv("KEYSTORE_PASSWORD")
                        keyAlias System.getenv("KEY_ALIAS")
                        keyPassword System.getenv("KEY_PASSWORD")
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                        minifyEnabled false
                    }
                }
            }
          GRADLE
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "İmza secrets bulunamadı; güncelleme imzası garanti edilmeyen debug APK üretilecek."
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Wear OS senkron ve saat modulu
        run: |
          set -e
          echo "=== settings.gradle (once) ==="
          cat android/settings.gradle 2>/dev/null || true
          python3 scripts/ci-wear-setup.py
          python3 scripts/ci-lint-relax.py
          echo "=== settings.gradle (sonra) ==="
          cat android/settings.gradle 2>/dev/null || true
          test -f android/wear/build.gradle
          test -f android/wear/src/main/AndroidManifest.xml

      # Aynı release sertifikasını telefon ve saat uygulamasında kullan.
      # Böylece saat APK'sı imzasız bırakılmaz.
      - name: Wear OS release imzasini yapilandir
        if: ${{ steps.signing.outputs.build_type == 'release' }}
        run: |
          set -e
          cat >> android/wear/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../keystore/garajim.jks")
                      storeType "pkcs12"
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Telefon ve Wear OS APK derle
        run: |
          set -e
          cd android
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.build_type }}" = "release" ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease :wear:assembleRelease
          else
            ./gradlew --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug
          fi
          echo "=== Üretilen telefon APK dosyalari ==="
          find app/build/outputs/apk -type f -name '*.apk' -print
          echo "=== Üretilen Wear OS APK dosyalari ==="
          find wear/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)" || { echo "Telefon APK'si bulunamadi"; exit 1; }
          test -n "$(find wear/build/outputs/apk -type f -name '*.apk' -print -quit)" || { echo "Wear OS APK'si bulunamadi"; exit 1; }

      - name: Telefon APK yukle
        uses: actions/upload-artifact@v6
        with:
          name: Garajim-Mobil-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Wear OS APK yukle
        uses: actions/upload-artifact@v6
        with:
          name: Garajim-WearOS-APK
          path: android/wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
