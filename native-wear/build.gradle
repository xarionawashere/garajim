apply plugin: 'com.android.application'

android {
    namespace 'com.garajim.wear'
    compileSdk 34
    defaultConfig {
        // Google Wearable Data Layer requires the same applicationId on phone and watch.
        // namespace remains separate for the watch Java package; applicationId matches mobile.
        applicationId "com.garajim.app"
        minSdk 26
        targetSdk 34
        versionCode 1004007
        versionName "1.4.7"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}
